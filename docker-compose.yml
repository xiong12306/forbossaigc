# BossAIGC 生产部署 docker-compose
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bossaigc-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PORT=8000
      - WEB_CONCURRENCY=1
    volumes:
      - app-data:/app/data
    expose:
      - "8000"
    networks:
      - boss-net

  nginx:
    image: nginx:alpine
    container_name: bossaigc-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      # - "443:443"  # HTTPS 证书签发后再开启
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-www:/var/www/certbot
      - certbot-certs:/etc/letsencrypt
      - nginx-logs:/var/log/nginx
    depends_on:
      - app
    networks:
      - boss-net

  # HTTPS 证书签发后手动运行：
  # docker compose run --rm certbot
  certbot:
    image: certbot/certbot:latest
    profiles: ["certbot"]
    volumes:
      - certbot-www:/var/www/certbot
      - certbot-certs:/etc/letsencrypt
    entrypoint: >
      certbot certonly --webroot
      --webroot-path=/var/www/certbot
      --email admin@xjloveqrj.pw
      --agree-tos --no-eff-email
      -d xjloveqrj.pw -d www.xjloveqrj.pw

volumes:
  app-data:
  certbot-www:
  certbot-certs:
  nginx-logs:

networks:
  boss-net:
    driver: bridge
