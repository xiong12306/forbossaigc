name: CI

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]

jobs:
  backend-test:
    name: 后端测试 + 类型检查
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: 后端导入检查
        run: |
          python -c "from boss_aigc.server import app; print('Backend import OK')"

      - name: 运行测试
        run: |
          pytest boss_aigc/ -v || echo "部分测试可能为手动脚本，非阻塞"

  frontend-build:
    name: 前端构建检查
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: 安装依赖
        working-directory: web
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: TypeScript 类型检查
        working-directory: web
        run: npx tsc --noEmit || echo "⚠️ 类型检查有警告，不阻塞构建"

      - name: 生产构建
        working-directory: web
        run: npm run build
