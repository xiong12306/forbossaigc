name: Deploy

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  ci-check:
    name: CI 检查通过
    uses: ./.github/workflows/ci.yml

  deploy:
    name: 部署到生产服务器
    runs-on: ubuntu-latest
    needs: ci-check
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    steps:
      - name: 部署到服务器
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          script: |
            set -e
            cd /opt/bossaigc

            # 如果还没有项目代码（首次部署），提示手动部署
            if [ ! -f "docker-compose.yml" ]; then
              echo "❌ 首次部署请参考 README.md 手动完成初始部署"
              exit 1
            fi

            # 更新脚本：直接从 GitHub 拉取最新代码（不需要本地 push）
            # 通过 GitHub API 下载最新代码 zip 解压，避免在服务器上配置 git 凭据
            echo "正在下载最新代码..."
            curl -sL "https://github.com/${{ github.repository }}/archive/refs/heads/${{ github.ref_name }}.tar.gz" -o /tmp/bossaigc-latest.tar.gz
            tar -xzf /tmp/bossaigc-latest.tar.gz -C /tmp/
            # 解压出来的目录名是 bossaigc-main 或 bossaigc-master
            EXTRACTED_DIR=$(ls -d /tmp/forBossAIGC-* 2>/dev/null || ls -d /tmp/bossaigc-* 2>/dev/null || echo "")
            if [ -z "$EXTRACTED_DIR" ]; then
              EXTRACTED_DIR="/tmp/forBossAIGC-${{ github.ref_name }}"
            fi
            if [ -d "$EXTRACTED_DIR" ]; then
              # 复制更新后的代码文件（保留 .env 和 data 目录）
              rsync -av --exclude='.env' --exclude='data/' --exclude='logs/' --exclude='boss_aigc/static/' --exclude='.git/' "$EXTRACTED_DIR/" /opt/bossaigc/
              rm -rf "$EXTRACTED_DIR" /tmp/bossaigc-latest.tar.gz
              echo "代码已更新"
            else
              echo "⚠️  无法自动下载代码，尝试用 update.sh 更新"
            fi

            # 给 update.sh 执行权限
            chmod +x /opt/bossaigc/update.sh

            # 执行更新
            bash /opt/bossaigc/update.sh

            echo ""
            echo "=========================================="
            echo "  ✅ 部署完成！"
            echo "=========================================="
