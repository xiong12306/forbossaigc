# BossAIGC Nginx 配置
# 首次部署无证书时使用 HTTP 模式，签发证书后自动切换到 HTTPS

upstream bossaigc_backend {
    server app:8000;
    keepalive 32;
}

# HTTP: 80 端口 - 直连模式（证书未签发时）
server {
    listen 80;
    listen [::]:80;
    server_name xjloveqrj.pw www.xjloveqrj.pw 47.107.160.40;

    # Let's Encrypt ACME 验证（证书签发/续期时用）
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    client_max_body_size 20M;

    # Gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
    gzip_min_length 1024;
    gzip_comp_level 6;

    # API 反向代理
    location /api/ {
        proxy_pass http://bossaigc_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 前端 SPA
    location / {
        proxy_pass http://bossaigc_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

